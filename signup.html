<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Lab Scientist Hub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section>

        <h1>Create Your Account</h1>

        <form id="signup-form">

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" required>

            <button type="submit">Sign Up</button>

        </form>

        <p id="message"></p>

        <p>
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://frkhpefjozwjlnoxsfiz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_s1MtFLZRWXdcfPNnjC0Wg_e8sZK4fv";

        const supabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        document.getElementById("signup-form").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            message.textContent = "Creating your account...";

            try {

                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    message.textContent = "Error: " + error.message;
                    return;
                }

                message.textContent =
                    "Account created successfully! Please check your email and confirm your account.";

            } catch (error) {

                message.textContent =
                    "Something went wrong: " + error.message;

            }

        });

    </script>

</body>

    </html>
